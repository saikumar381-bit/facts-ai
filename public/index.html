<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facts AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100vh;
      height: 100dvh;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */

    .header {
      flex: 0 0 auto;
      height: 70px;
      padding: 10px 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 3px 0 0;
      color: #777;
      font-size: 12px;
    }

    #clearButton {
      width: auto;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: #fff;
      color: #555;
      font-size: 13px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    /* CHAT */

    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 15px;
    }

    .message {
      display: block;
      width: fit-content;
      max-width: 85%;
      margin-bottom: 14px;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      margin-left: auto;
      background: #111;
      color: #fff;
    }

    .assistant {
      margin-right: auto;
      background: #f0f0f0;
      color: #111;
    }

    .welcome {
      text-align: center;
      padding: 20px 15px;
      margin-top: 20vh;
    }

    .welcome h2 {
      font-size: 26px;
      margin: 0 0 10px;
    }

    .welcome p {
      color: #777;
      line-height: 1.6;
      margin: 0;
    }

    /* INPUT */

    .input-area {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fff;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #messageInput {
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      min-height: 46px;
      max-height: 130px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    #messageInput:focus {
      border-color: #888;
    }

    #sendButton {
      flex: 0 0 72px;
      width: 72px;
      height: 46px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .header {
        height: 64px;
        padding: 8px 12px;
      }

      .logo {
        width: 38px;
        height: 38px;
        min-width: 38px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 11px;
      }

      #clearButton {
        height: 34px;
        padding: 0 9px;
        font-size: 12px;
      }

      #chat {
        padding: 15px 10px;
      }

      .message {
        max-width: 90%;
        font-size: 15px;
      }

      .welcome {
        margin-top: 18vh;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .input-area {
        padding: 8px;
        gap: 7px;
      }

      #messageInput {
        min-height: 44px;
        font-size: 16px;
      }

      #sendButton {
        flex-basis: 68px;
        width: 68px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">

      <div class="logo">F</div>

      <div class="header-info">
        <h1>Facts AI</h1>
        <p>Your personal facts & research assistant</p>
      </div>

      <button id="clearButton">Clear</button>

    </div>

    <div id="chat"></div>

    <div class="input-area">

      <textarea
        id="messageInput"
        placeholder="Facts AIని ఏదైనా అడగండి..."
        rows="1"
      ></textarea>

      <button id="sendButton">Send</button>

    </div>

  </div>

  <script>

    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");

    const STORAGE_KEY = "facts_ai_chat_history";

    let conversationHistory = [];

    function saveHistory() {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(conversationHistory)
      );
    }

    function addMessageToScreen(text, role) {

      const message = document.createElement("div");

      message.className =
        "message " +
        (role === "user" ? "user" : "assistant");

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    function showWelcome() {

      chat.innerHTML = "";

      const welcome =
        document.createElement("div");

      welcome.className = "welcome";

      welcome.innerHTML = `
        <h2>నమస్కారం 👋</h2>
        <p>
          నేను Facts AI. మన Facts Channel కోసం
          మీకు సహాయం చేయడానికి సిద్ధంగా ఉన్నాను.
        </p>
      `;

      chat.appendChild(welcome);
    }

    function renderHistory() {

      chat.innerHTML = "";

      if (conversationHistory.length === 0) {
        showWelcome();
        return;
      }

      conversationHistory.forEach(function(item) {

        addMessageToScreen(
          item.text,
          item.role
        );

      });

      chat.scrollTop = chat.scrollHeight;
    }

    function loadHistory() {

      try {

        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (saved) {

          const parsed =
            JSON.parse(saved);

          if (Array.isArray(parsed)) {
            conversationHistory = parsed;
          }

        }

      } catch (error) {

        conversationHistory = [];

      }

      renderHistory();
    }

    function addMessage(text, role) {

      addMessageToScreen(text, role);

      conversationHistory.push({
        role: role,
        text: text
      });

      saveHistory();
    }

    async function sendMessage() {

      const message =
        input.value.trim();

      if (!message || sendButton.disabled) {
        return;
      }

      /*
       * Previous messages మాత్రమే backendకి పంపుతాం.
       * Current message separate-ga పంపుతాం.
       */
      const previousHistory =
        conversationHistory.slice();

      addMessage(
        message,
        "user"
      );

      input.value = "";

      sendButton.disabled = true;

      const thinking =
        addMessageToScreen(
          "ఆలోచిస్తున్నాను...",
          "assistant"
        );

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                message: message,
                history: previousHistory
              })
            }
          );

        const data =
          await response.json();

        thinking.remove();

        if (!response.ok) {

          addMessage(
            data.error ||
            "ఏదో సమస్య వచ్చింది.",
            "assistant"
          );

        } else {

          addMessage(
            data.reply ||
            "No response received.",
            "assistant"
          );

        }

      } catch (error) {

        thinking.remove();

        addMessage(
          "Serverతో connection కాలేదు.",
          "assistant"
        );

      } finally {

        sendButton.disabled = false;

        input.focus();

      }
    }

    clearButton.addEventListener(
      "click",
      function() {

        const ok =
          confirm(
            "ఈ conversation మొత్తాన్ని clear చేయాలా?"
          );

        if (!ok) {
          return;
        }

        conversationHistory = [];

        localStorage.removeItem(
          STORAGE_KEY
        );

        renderHistory();

        input.focus();
      }
    );

    sendButton.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();
        }

      }
    );

    loadHistory();

  </script>

</body>
</html>
