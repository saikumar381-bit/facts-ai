    #clearButton {

    #clearButton:hover {

    .welcome {

<body>

  <div class="app">

    <div class="header">

      <div class="logo">F</div>

      <div class="header-info">
        <h1>Facts AI</h1>
        <p>Your personal facts & research assistant</p>
      </div>

      <button id="clearButton">
        Clear
      </button>

    </div>

    <div id="chat">

      <div class="welcome" id="welcome">
        <h2>నమస్కారం 👋</h2>

        <p>
          నేను Facts AI. మన Facts Channel కోసం
          మీకు సహాయం చేయడానికి సిద్ధంగా ఉన్నాను.
        </p>
      </div>

    </div>

    <div class="input-area">

      <textarea
        id="messageInput"
        placeholder="Facts AIని ఏదైనా అడగండి..."
        rows="1"
      ></textarea>

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>

  <script>

    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const welcome = document.getElementById("welcome");

    const STORAGE_KEY = "facts_ai_chat_history";

    let conversationHistory = [];

    // Load saved conversation
    function loadHistory() {

      try {

        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (saved) {

          const parsed = JSON.parse(saved);

          if (Array.isArray(parsed)) {
            conversationHistory = parsed;
          }

        }

      } catch (error) {

        console.error(
          "Could not load chat history:",
          error
        );

        conversationHistory = [];

      }

      renderHistory();
    }


    // Save conversation
    function saveHistory() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(conversationHistory)
        );

      } catch (error) {

        console.error(
          "Could not save chat history:",
          error
        );

      }
    }


    // Render saved messages
    function renderHistory() {

      chat.innerHTML = "";

      if (conversationHistory.length === 0) {

        const welcomeDiv =
          document.createElement("div");

        welcomeDiv.className = "welcome";
        welcomeDiv.id = "welcome";

        welcomeDiv.innerHTML = `
          <h2>నమస్కారం 👋</h2>
          <p>
            నేను Facts AI. మన Facts Channel కోసం
            మీకు సహాయం చేయడానికి సిద్ధంగా ఉన్నాను.
          </p>
        `;

        chat.appendChild(welcomeDiv);

        return;
      }

      for (const item of conversationHistory) {

        addMessageToScreen(
          item.text,
          item.role
        );

      }

      chat.scrollTop = chat.scrollHeight;
    }


    // Add one message to screen
    function addMessageToScreen(text, role) {

      const message =
        document.createElement("div");

      message.className =
        "message " +
        (role === "user"
          ? "user"
          : "assistant");

      message.textContent = text;

      chat.appendChild(message);

      return message;
    }


    // Add message to history and screen
    function addMessage(text, role) {

      const message =
        document.createElement("div");

      message.className =
        "message " +
        (role === "user"
          ? "user"
          : "assistant");

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

      conversationHistory.push({
        role: role,
        text: text
      });

      saveHistory();

      return message;
    }


    // Send message
    async function sendMessage() {

      const message =
        input.value.trim();

      if (!message) {
        return;
      }

      // Save a copy of previous history
      const previousHistory =
        [...conversationHistory];

      // Show user message
      addMessage(
        message,
        "user"
      );

      input.value = "";

      sendButton.disabled = true;

      const thinkingMessage =
        addMessage(
          "ఆలోచిస్తున్నాను...",
          "assistant"
        );

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                message: message,

                history: previousHistory

              })
            }
          );

        const data =
          await response.json();

        thinkingMessage.remove();

        // Remove temporary thinking message
        conversationHistory =
          conversationHistory.filter(
            item =>
              !(
                item.role === "assistant" &&
                item.text === "ఆలోచిస్తున్నాను..."
              )
          );

        if (!response.ok) {

          addMessage(
            data.error ||
            "ఏదో సమస్య వచ్చింది.",
            "assistant"
          );

        } else {

          addMessage(
            data.reply ||
            "No response received.",
            "assistant"
          );

        }

      } catch (error) {

        thinkingMessage.remove();

        conversationHistory =
          conversationHistory.filter(
            item =>
              !(
                item.role === "assistant" &&
                item.text === "ఆలోచిస్తున్నాను..."
              )
          );

        addMessage(
          "Serverతో connection కాలేదు. Deployment configuration check చేయాలి.",
          "assistant"
        );

      } finally {

        sendButton.disabled = false;

        input.focus();

      }
    }


    // Clear chat
    clearButton.addEventListener(
      "click",
      function() {

        const confirmed =
          confirm(
            "ఈ conversation మొత్తాన్ని clear చేయాలా?"
          );

        if (!confirmed) {
          return;
        }

        conversationHistory = [];

        localStorage.removeItem(
          STORAGE_KEY
        );

        renderHistory();

        input.focus();

      }
    );


    // Send button
    sendButton.addEventListener(
      "click",
      sendMessage
    );


    // Enter = send
    // Shift + Enter = new line
    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    // Load saved chat when page opens
    loadHistory();

  </script>

</body>
  </html>
