<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Facts AI — తెలుగు AI సహాయకుడు</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Telugu", sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111c30;
      border-bottom: 1px solid #263449;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    header h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }

    header p {
      margin: 0;
      color: #a8b6cb;
      font-size: 12px;
    }

    .status {
      margin-left: auto;
      font-size: 12px;
      color: #86efac;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .welcome {
      text-align: center;
      padding: 35px 10px 24px;
    }

    .welcome h2 {
      font-size: 26px;
      margin: 0 0 12px;
    }

    .welcome p {
      color: #a8b6cb;
      line-height: 1.8;
      margin: 0;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 15px 0 22px;
    }

    .suggestion {
      text-align: left;
      padding: 14px;
      color: #e2e8f0;
      background: #111c30;
      border: 1px solid #263449;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.6;
    }

    .suggestion:hover {
      border-color: #3b82f6;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 20px;
    }

    .message {
      max-width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #1d4ed8;
      max-width: 90%;
    }

    .assistant {
      align-self: stretch;
      background: #111c30;
      border: 1px solid #263449;
    }

    .message-label {
      display: block;
      font-size: 12px;
      color: #93c5fd;
      margin-bottom: 6px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 0 8px;
      background: #0b1120;
      margin-top: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 10px;
      border: 1px solid #334155;
      background: #111c30;
      border-radius: 16px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      width: 100%;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 12px 6px;
      font: inherit;
      font-size: 15px;
      line-height: 1.6;
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    #send {
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      padding: 13px 16px;
      font-size: 15px;
      cursor: pointer;
      min-height: 46px;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: #94a3b8;
      font-size: 12px;
      padding: 9px 3px;
    }

    .clear-button {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #64748b;
    }

    @media (max-width: 520px) {
      header h1 {
        font-size: 18px;
      }

      main {
        padding: 12px;
      }

      .welcome {
        padding-top: 25px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .user {
        max-width: 96%;
      }

      #send {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">✦</div>

    <div>
      <h1>Facts AI</h1>
      <p>తెలుగు పరిశోధన మరియు AI సహాయకుడు</p>
    </div>

    <div class="status" id="status">Ready</div>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <h2>నమస్కారం! 👋</h2>
      <p>
        మీ ప్రశ్న అడగండి.<br>
        వాస్తవాలు, తాజా సమాచారం, పరిశోధన మరియు వీడియోల తయారీలో సహాయం పొందండి.
      </p>
    </section>

    <section class="suggestions" id="suggestions">
      <button class="suggestion"
        data-prompt="ఈరోజు భారతదేశంలో ముఖ్యమైన వార్తలు చెప్పు. మూలాలు, తేదీలు అందుబాటులో ఉంటే ఇవ్వు.">
        📰 తాజా వార్తలు
      </button>

      <button class="suggestion"
        data-prompt="సూర్యుడి గురించి ముఖ్యమైన వాస్తవాలు వివరించు.">
        ☀️ సైన్స్ విషయాలు
      </button>

      <button class="suggestion"
        data-prompt="ఒక ఆసక్తికరమైన తెలుగు YouTube వీడియో స్క్రిప్ట్ తయారు చేయి.">
        🎬 వీడియో స్క్రిప్ట్
      </button>

      <button class="suggestion"
        data-prompt="ఒక సమాచారాన్ని ఎలా fact-check చేయాలో వివరించు.">
        🔎 Fact checking
      </button>
    </section>

    <section id="chat" aria-live="polite"></section>

    <section class="composer">
      <div class="input-area">
        <textarea
          id="message"
          placeholder="మీ ప్రశ్నను తెలుగులో లేదా ఇంగ్లీషులో టైప్ చేయండి..."
          aria-label="మీ ప్రశ్న"
        ></textarea>

        <button id="send" type="button">పంపు ➤</button>
      </div>

      <div class="toolbar">
        <span>సమాచారాన్ని ముఖ్యమైన సందర్భాల్లో ధృవీకరించండి.</span>
        <button class="clear-button" id="clear" type="button">
          చాట్ తొలగించు
        </button>
      </div>
    </section>
  </main>

  <footer>
    Facts AI · తెలుగు AI సహాయకుడు
  </footer>

  <script>
    const API_URL = "/api/chat";
    const STORAGE_KEY = "facts_ai_ui_history_v1";

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const clearButton = document.getElementById("clear");
    const statusLabel = document.getElementById("status");
    const welcome = document.getElementById("welcome");
    const suggestions = document.getElementById("suggestions");

    let conversationHistory = [];

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      const parsed = saved ? JSON.parse(saved) : [];

      if (Array.isArray(parsed)) {
        conversationHistory = parsed
          .filter(item =>
            item &&
            typeof item.text === "string" &&
            ["user", "assistant"].includes(item.role)
          )
          .slice(-40);
      }
    } catch (error) {
      console.error("Could not load chat history:", error);
    }

    function saveHistory() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(conversationHistory.slice(-40))
        );
      } catch (error) {
        console.error("Could not save chat history:", error);
      }
    }

    function addMessage(role, text) {
      const message = document.createElement("div");
      message.className = "message " + role;

      const label = document.createElement("span");
      label.className = "message-label";
      label.textContent = role === "user" ? "మీరు" : "Facts AI";

      const content = document.createElement("div");
      content.textContent = text;

      message.appendChild(label);
      message.appendChild(content);
      chat.appendChild(message);

      return message;
    }

    function renderHistory() {
      chat.replaceChildren();

      for (const item of conversationHistory) {
        addMessage(item.role, item.text);
      }

      const hasMessages = conversationHistory.length > 0;
      welcome.hidden = hasMessages;
      suggestions.hidden = hasMessages;

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "auto"
      });
    }

    async function sendMessage(prefill) {
      const message = (
        typeof prefill === "string" ? prefill : input.value
      ).trim();

      if (!message || sendButton.disabled) {
        return;
      }

      const historyForRequest = conversationHistory
        .slice(-12)
        .map(item => ({
          role: item.role,
          text: item.text
        }));

      conversationHistory.push({
        role: "user",
        text: message
      });

      saveHistory();
      renderHistory();

      input.value = "";
      sendButton.disabled = true;
      statusLabel.textContent = "Thinking...";

      const pending = addMessage("assistant", "సమాధానం తయారు చేస్తున్నాను...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            history: historyForRequest
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("సర్వర్ నుంచి సరైన JSON సమాధానం రాలేదు.");
        }

        if (!response.ok) {
          throw new Error(
            data?.error || "Request failed: HTTP " + response.status
          );
        }

        if (typeof data?.reply !== "string" || !data.reply.trim()) {
          throw new Error("AI సమాధానం ఖాళీగా ఉంది.");
        }

        pending.remove();

        conversationHistory.push({
          role: "assistant",
          text: data.reply.trim()
        });

        conversationHistory = conversationHistory.slice(-40);
        saveHistory();
        renderHistory();

        statusLabel.textContent =
          data?.research?.searchSucceeded === true
            ? "Search used"
            : "Ready";

      } catch (error) {
        pending.remove();

        const errorMessage =
          "క్షమించండి, సమాధానం పొందలేకపోయాం.\n" +
          (error?.message || "తెలియని సమస్య") +
          "\nకొద్దిసేపటి తర్వాత మళ్లీ ప్రయత్నించండి.";

        conversationHistory.push({
          role: "assistant",
          text: errorMessage
        });

        saveHistory();
        renderHistory();
        statusLabel.textContent = "Error";

      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener("click", () => {
      sendMessage();
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click", () => {
        sendMessage(button.dataset.prompt || "");
      });
    });

    clearButton.addEventListener("click", () => {
      if (!confirm("చాట్ చరిత్రను తొలగించాలా?")) {
        return;
      }

      conversationHistory = [];
      saveHistory();
      renderHistory();
      statusLabel.textContent = "Ready";
    });

    renderHistory();
  </script>
</body>
  </html>
