<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facts AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */

    .header {
      flex: 0 0 auto;
      height: 70px;
      padding: 10px 15px;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
    }

    .logo {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #111111;
    }

    .header p {
      margin: 3px 0 0;
      color: #777777;
      font-size: 12px;
    }

    #clearButton {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #dddddd;
      border-radius: 9px;
      background: #ffffff;
      color: #555555;
      font-size: 13px;
      cursor: pointer;
    }

    #clearButton:active {
      background: #eeeeee;
    }

    /* CHAT */

    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 15px;
      scroll-behavior: smooth;
    }

    .message {
      display: block;
      width: fit-content;
      max-width: 85%;
      margin-bottom: 14px;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 15px;
    }

    .user {
      margin-left: auto;
      margin-right: 0;
      background: #111111;
      color: #ffffff;
    }

    .assistant {
      margin-left: 0;
      margin-right: auto;
      background: #f0f0f0;
      color: #111111;
    }

    .welcome {
      text-align: center;
      padding: 20px 15px;
      margin-top: 18vh;
    }

    .welcome h2 {
      margin: 0 0 10px;
      font-size: 27px;
      color: #111111;
    }

    .welcome p {
      margin: 0 auto;
      max-width: 500px;
      color: #777777;
      line-height: 1.6;
      font-size: 15px;
    }

    /* THINKING */

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 18px;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #777777;
      animation: thinking 1.2s infinite ease-in-out;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes thinking {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* INPUT */

    .input-area {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px;
      border-top: 1px solid #dddddd;
      background: #ffffff;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      max-height: 130px;
      resize: none;
      border: 1px solid #cccccc;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      font-family: Arial, sans-serif;
      outline: none;
      background: #ffffff;
      color: #111111;
    }

    #messageInput:focus {
      border-color: #888888;
    }
