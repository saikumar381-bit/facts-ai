<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facts AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      justify-content: center;
    }

    button,
    textarea {
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 950px;
      height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      flex: 0 0 auto;
      min-height: 70px;
      padding: 10px 15px;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
    }

    .logo {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #111111;
    }

    .header p {
      margin: 3px 0 0;
      color: #777777;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .header-button {
      height: 36px;
      padding: 0 11px;
      border: 1px solid #dddddd;
      border-radius: 9px;
      background: #ffffff;
      color: #555555;
      font-size: 13px;
      cursor: pointer;
    }

    .header-button:hover {
      background: #f7f7f7;
    }

    .header-button:active {
      background: #eeeeee;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 16px;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #cccccc;
      border-radius: 10px;
    }

    .message-row {
      width: 100%;
      display: flex;
      margin-bottom: 16px;
    }

    .message-row.user-row {
      justify-content: flex-end;
    }

    .message-row.assistant-row {
      justify-content: flex-start;
    }

    .message-container {
      max-width: 85%;
    }

    .message {
      position: relative;
      width: fit-content;
      max-width: 100%;
      padding: 12px 14px;
      border-radius: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 15px;
    }

    .user-message {
      background: #111111;
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    .assistant-message {
      background: #f0f0f0;
      color: #111111;
      border-bottom-left-radius: 5px;
    }

    .message-copy {
      display: block;
      margin-top: 6px;
      border: none;
      background: transparent;
      color: #777777;
      padding: 2px 0;
      font-size: 11px;
      cursor: pointer;
    }

    .message-copy:hover {
      color: #111111;
    }

    /* =========================
       WELCOME
    ========================= */

    .welcome {
      text-align: center;
      max-width: 650px;
      margin: 10vh auto 0;
      padding: 20px 15px;
    }

    .welcome-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
    }

    .welcome h2 {
      margin: 0 0 9px;
      font-size: 27px;
      color: #111111;
    }

    .welcome p {
      margin: 0 auto 20px;
      color: #777777;
      line-height: 1.6;
      font-size: 15px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .suggestion-button {
      border: 1px solid #dddddd;
      background: #ffffff;
      color: #444444;
      border-radius: 20px;
      padding: 9px 13px;
      font-size: 13px;
      cursor: pointer;
    }

    .suggestion-button:hover {
      background: #f5f5f5;
    }

    /* =========================
       THINKING
    ========================= */

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 18px;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #777777;
      animation: thinking 1.2s infinite ease-in-out;
    }

    .thinking-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .thinking-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes thinking {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* =========================
       INPUT
    ========================= */

    .input-area {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px;
      border-top: 1px solid #dddddd;
      background: #ffffff;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      width: 100%;
    }

    #messageInput {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      max-height: 130px;
      resize: none;
      border: 1px solid #cccccc;
      border-radius: 13px;
      padding: 12px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #111111;
      line-height: 1.4;
    }

    #messageInput:focus {
      border-color: #888888;
    }

    #messageInput::placeholder {
      color: #999999;
    }

    #sendButton {
      flex: 0 0 70px;
      width: 70px;
      height: 46px;
      border: none;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #222222;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-hint {
      margin: 6px 4px 0;
      color: #999999;
      font-size: 10px;
      text-align: center;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {
        min-height: 64px;
        height: 64px;
        padding: 8px 10px;
        gap: 7px;
      }

      .logo {
        width: 38px;
        height: 38px;
        min-width: 38px;
        font-size: 16px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 10px;
      }

      .header-actions {
        gap: 4px;
      }

      .header-button {
        height: 34px;
        padding: 0 8px;
        font-size: 11px;
      }

      #chat {
        padding: 16px 10px;
      }

      .message-container {
        max-width: 91%;
      }

      .message {
        font-size: 15px;
        padding: 11px 13px;
      }

      .welcome {
        margin-top: 8vh;
        padding: 15px 8px;
      }

      .welcome-icon {
        width: 56px;
        height: 56px;
        font-size: 23px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .welcome p {
        font-size: 14px;
      }

      .suggestion-button {
        font-size: 12px;
        padding: 8px 11px;
      }

      .input-area {
        padding: 8px;
      }

      #messageInput {
        min-height: 44px;
        font-size: 16px;
        padding: 11px;
      }

      #sendButton {
        flex-basis: 68px;
        width: 68px;
        height: 44px;
      }

      .input-hint {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <div class="header">

      <div class="logo">F</div>

      <div class="header-info">
        <h1>Facts AI</h1>
        <p>Your personal facts & research assistant</p>
      </div>

      <div class="header-actions">

        <button
          id="newChatButton"
          class="header-button"
          type="button"
        >
          New Chat
        </button>

        <button
          id="clearButton"
          class="header-button"
          type="button"
        >
          Clear
        </button>

      </div>

    </div>


    <!-- CHAT -->

    <div id="chat"></div>


    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Facts AIని ఏదైనా అడగండి..."
          rows="1"
          autocomplete="off"
          aria-label="Message"
        ></textarea>

        <button
          id="sendButton"
          type="button"
        >
          Send
        </button>

      </div>

      <div class="input-hint">
        Enter to send • Shift + Enter for new line
      </div>

    </div>

  </div>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const clearButton =
      document.getElementById("clearButton");

    const newChatButton =
      document.getElementById("newChatButton");


    /* =========================
       STORAGE
    ========================= */

    const STORAGE_KEY =
      "facts_ai_chat_history_v3";

    let conversationHistory = [];


    /* =========================
       WELCOME
    ========================= */

    function showWelcome() {

      chat.innerHTML = "";

      const welcome =
        document.createElement("div");

      welcome.className = "welcome";

      welcome.innerHTML = `
        <div class="welcome-icon">F</div>

        <h2>నమస్కారం 👋</h2>

        <p>
          నేను Facts AI. Facts, research,
          explanations మరియు content ideas
          కోసం మీకు సహాయం చేయడానికి సిద్ధంగా ఉన్నాను.
        </p>

        <div class="suggestions">

          <button
            class="suggestion-button"
            data-question="భారతదేశం గురించి 5 ఆసక్తికరమైన facts చెప్పండి."
          >
            🇮🇳 India Facts
          </button>

          <button
            class="suggestion-button"
            data-question="ఒక ఆసక్తికరమైన science fact చెప్పండి."
          >
            🔬 Science Fact
          </button>

          <button
            class="suggestion-button"
            data-question="YouTube Shorts కోసం ఒక interesting facts idea ఇవ్వండి."
          >
            🎬 YouTube Idea
          </button>

          <button
            class="suggestion-button"
            data-question="ఒక topicని simple Teluguలో explain చేయండి."
          >
            💡 Explain
          </button>

        </div>
      `;

      chat.appendChild(welcome);

      const buttons =
        welcome.querySelectorAll(
          ".suggestion-button"
        );

      buttons.forEach(function(button) {

        button.addEventListener(
          "click",
          function() {

            input.value =
              button.dataset.question;

            autoResizeInput();

            input.focus();

          }
        );

      });
    }


    /* =========================
       SAVE HISTORY
    ========================= */

    function saveHistory() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(conversationHistory)
        );

      } catch (error) {

        console.error(
          "Could not save chat history:",
          error
        );

      }
    }


    /* =========================
       LOAD HISTORY
    ========================= */

    function loadHistory() {

      try {

        const saved =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (saved) {

          const parsed =
            JSON.parse(saved);

          if (Array.isArray(parsed)) {

            conversationHistory =
              parsed.filter(function(item) {

                return (
                  item &&
                  typeof item.text === "string" &&
                  (
                    item.role === "user" ||
                    item.role === "assistant"
                  )
                );

              });

          }

        }

      } catch (error) {

        conversationHistory = [];

      }

      renderHistory();
    }


    /* =========================
       MESSAGE UI
    ========================= */

    function addMessageToScreen(
      text,
      role,
      options = {}
    ) {

      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (
          role === "user"
            ? "user-row"
            : "assistant-row"
        );

      const container =
        document.createElement("div");

      container.className =
        "message-container";

      const message =
        document.createElement("div");

      message.className =
        "message " +
        (
          role === "user"
            ? "user-message"
            : "assistant-message"
        );

      message.textContent = text;

      container.appendChild(message);

      if (
        role === "assistant" &&
        options.copy !== false &&
        text
      ) {

        const copyButton =
          document.createElement("button");

        copyButton.className =
          "message-copy";

        copyButton.type = "button";

        copyButton.textContent =
          "Copy";

        copyButton.addEventListener(
          "click",
          async function() {

            try {

              await navigator.clipboard.writeText(
                text
              );

              copyButton.textContent =
                "Copied ✓";

              setTimeout(
                function() {
                  copyButton.textContent =
                    "Copy";
                },
                1500
              );

            } catch (error) {

              copyButton.textContent =
                "Copy failed";

              setTimeout(
                function() {
                  copyButton.textContent =
                    "Copy";
                },
                1500
              );

            }

          }
        );

        container.appendChild(copyButton);
      }

      row.appendChild(container);

      chat.appendChild(row);

      chat.scrollTop =
        chat.scrollHeight;

      return row;
    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessage(
      text,
      role
    ) {

      addMessageToScreen(
        text,
        role
      );

      conversationHistory.push({
        role: role,
        text: text
      });

      saveHistory();
    }


    /* =========================
       RENDER HISTORY
    ========================= */

    function renderHistory() {

      chat.innerHTML = "";

      if (
        conversationHistory.length === 0
      ) {

        showWelcome();

        return;
      }

      conversationHistory.forEach(
        function(item) {

          addMessageToScreen(
            item.text,
            item.role
          );

        }
      );

      chat.scrollTop =
        chat.scrollHeight;
    }


    /* =========================
       THINKING
    ========================= */

    function showThinking() {

      const row =
        document.createElement("div");

      row.className =
        "message-row assistant-row";

      const container =
        document.createElement("div");

      container.className =
        "message-container";

      const message =
        document.createElement("div");

      message.className =
        "message assistant-message";

      message.innerHTML = `
        <span class="thinking">
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
        </span>
      `;

      container.appendChild(message);

      row.appendChild(container);

      chat.appendChild(row);

      chat.scrollTop =
        chat.scrollHeight;

      return row;
    }


    /* =========================
       FRIENDLY ERRORS
    ========================= */

    function getFriendlyErrorMessage(
      errorText
    ) {

      const text =
        String(
          errorText || ""
        ).toLowerCase();

      if (
        text.includes("high demand") ||
        text.includes("service unavailable") ||
        text.includes("503") ||
        text.includes("temporarily")
      ) {

        return (
          "⚠️ ప్రస్తుతం AI service busyగా ఉంది. " +
          "కొద్దిసేపటి తర్వాత మళ్లీ ప్రయత్నించండి."
        );
      }

      if (
        text.includes("location is not supported") ||
        text.includes(
          "user location is not supported"
        )
      ) {

        return (
          "⚠️ ప్రస్తుతం AI service " +
          "request locationని support చేయడం లేదు."
        );
      }

      if (
        text.includes("429") ||
        text.includes("too many requests") ||
        text.includes("quota")
      ) {

        return (
          "⚠️ ప్రస్తుతం AI requests limit చేరుకుంది. " +
          "కొంత సమయం తర్వాత మళ్లీ ప్రయత్నించండి."
        );
      }

      if (
        text.includes("api key") ||
        text.includes("authentication") ||
        text.includes("unauthorized")
      ) {

        return (
          "⚠️ AI service configurationలో సమస్య ఉంది."
        );
      }

      return (
        "⚠️ ప్రస్తుతం AI response అందుబాటులో లేదు. " +
        "కొద్దిసేపటి తర్వాత మళ్లీ ప్రయత్నించండి."
      );
    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        input.value.trim();

      if (
        !message ||
        sendButton.disabled
      ) {

        return;
      }

      /*
        Keep only the conversation that existed
        before the new user message.
      */

      const previousHistory =
        conversationHistory
          .slice(-20);

      addMessage(
        message,
        "user"
      );

      input.value = "";

      autoResizeInput();

      sendButton.disabled = true;

      const thinking =
        showThinking();

      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                message: message,

                history:
                  previousHistory

              })
            }
          );


        let data = {};

        try {

          data =
            await response.json();

        } catch (jsonError) {

          data = {};

        }


        thinking.remove();


        if (!response.ok) {

          const friendly =
            getFriendlyErrorMessage(
              data.error
            );

          addMessage(
            friendly,
            "assistant"
          );

        } else {

          const reply =
            typeof data.reply === "string"
              ? data.reply
              : "No response received.";

          addMessage(
            reply,
            "assistant"
          );

        }

      } catch (error) {

        console.error(
          "Connection error:",
          error
        );

        thinking.remo
