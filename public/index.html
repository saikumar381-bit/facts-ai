
<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facts AI</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      justify-content: center;
    }

    button, textarea { font-family: Arial, sans-serif; }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100dvh;
      background: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      flex: 0 0 auto;
      min-height: 70px;
      padding: 10px 15px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
    }

    .logo, .welcome-icon {
      border-radius: 50%;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .logo {
      width: 42px;
      height: 42px;
      min-width: 42px;
      font-size: 18px;
    }

    .header-info { flex: 1; min-width: 0; }

    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #111;
    }

    .header p {
      margin: 3px 0 0;
      color: #777;
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .header-button {
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: #fff;
      color: #555;
      font-size: 13px;
      cursor: pointer;
    }

    #apiStatus {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
    }

    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 15px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 14px;
    }

    .user-row { justify-content: flex-end; }
    .assistant-row { justify-content: flex-start; }

    .message-container { max-width: 90%; min-width: 0; }

    .message {
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 15px;
    }

    .user-message {
      background: #111;
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .assistant-message {
      background: #f0f0f0;
      color: #111;
      border-bottom-left-radius: 5px;
    }

    .copy-button {
      border: none;
      background: transparent;
      color: #777;
      font-size: 12px;
      padding: 5px 0;
      cursor: pointer;
    }

    .welcome {
      text-align: center;
      padding: 20px 15px;
      margin-top: 10vh;
    }

    .welcome-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
      font-size: 25px;
    }

    .welcome h2 {
      margin: 0 0 10px;
      font-size: 27px;
      color: #111;
    }

    .welcome p {
      margin: 0 auto 20px;
      max-width: 520px;
      color: #777;
      line-height: 1.7;
      font-size: 15px;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .suggestion {
      border: 1px solid #ddd;
      background: #fff;
      color: #444;
      border-radius: 20px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 13px;
    }

    .thinking {
      display: inline-flex;
      gap: 5px;
      padding: 3px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #777;
      animation: pulse 1.2s infinite;
    }

    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }

    @keyframes pulse {
      0%, 60%, 100% {
        opacity: .35;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .input-area {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fff;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      max-height: 160px;
      resize: none;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      outline: none;
      background: #fff;
      color: #111;
      line-height: 1.5;
    }

    #messageInput:focus { border-color: #888; }

    #sendButton {
      flex: 0 0 70px;
      width: 70px;
      height: 46px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      color: #999;
      font-size: 10px;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      .header {
        min-height: 64px;
        padding: 8px 10px;
        gap: 7px;
      }

      .logo {
        width: 36px;
        height: 36px;
        min-width: 36px;
      }

      .header h1 { font-size: 17px; }
      .header p { font-size: 10px; }
      #apiStatus { font-size: 10px; }

      .header-button {
        min-height: 32px;
        padding: 0 7px;
        font-size: 11px;
      }

      #chat { padding: 15px 10px; }
      .message-container { max-width: 95%; }
      .message { font-size: 15px; }

      .welcome { margin-top: 7vh; }
      .welcome h2 { font-size: 23px; }
      .welcome p { font-size: 14px; }
      .suggestion { font-size: 12px; }
      .input-area { padding: 8px; }
      #sendButton { width: 64px; flex-basis: 64px; }
      .hint { display: none; }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">
      <div class="logo">F</div>

      <div class="header-info">
        <h1>Facts AI</h1>
        <p>Facts, Research & Content Assistant</p>
      </div>

      <span id="apiStatus">● Checking...</span>

      <div class="header-actions">
        <button id="newChatButton" class="header-button" type="button">
          New Chat
        </button>
        <button id="clearButton" class="header-button" type="button">
          Clear
        </button>
      </div>
    </div>

    <div id="chat" aria-live="polite"></div>

    <div class="input-area">
      <div class="input-box">
        <textarea
          id="messageInput"
          placeholder="Facts AIని ఏదైనా అడగండి..."
          rows="1"
          autocomplete="off"
          aria-label="మీ ప్రశ్న"></textarea>

        <button id="sendButton" type="button">Send</button>
      </div>

      <div class="hint">Enter to send · Shift + Enter for new line</div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");
    const newChatButton = document.getElementById("newChatButton");
    const apiStatus = document.getElementById("apiStatus");

    const STORAGE_KEY = "facts_ai_ui_history_v1";

    let conversationHistory = [];
    let isSending = false;

    function saveHistory() {
      try {
        // Keep browser storage within a reasonable size.
        conversationHistory = conversationHistory.slice(-40);
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(conversationHistory)
        );
      } catch (error) {
        console.error("Could not save chat history:", error);
      }
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height =
        Math.min(input.scrollHeight, 160) + "px";
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function showWelcome() {
      chat.innerHTML = "";

      const welcome = document.createElement("div");
      welcome.className = "welcome";

      const icon = document.createElement("div");
      icon.className = "welcome-icon";
      icon.textContent = "F";

      const title = document.createElement("h2");
      title.textContent = "నమస్కారం 👋";

      const description = document.createElement("p");
      description.textContent =
        "నేను Facts AI. Facts, research, explanations, " +
        "మరియు video content ideasలో మీకు సహాయం చేస్తాను.";

      const suggestions = document.createElement("div");
      suggestions.className = "suggestions";

      const questions = [
        ["🇮🇳 India Facts", "భారతదేశం గురించి 5 ఆసక్తికరమైన facts చెప్పండి."],
        ["🔬 Science Fact", "ఒక ఆసక్తికరమైన science fact వివరించండి."],
        ["🎬 YouTube Idea", "YouTube Shorts కోసం ఒక interesting facts idea ఇవ్వండి."],
        ["💡 Explain", "ఒక topicని simple Teluguలో explain చేయండి."]
      ];

      for (const [label, question] of questions) {
        const button = document.createElement("button");
        button.className = "suggestion";
        button.type = "button";
        button.textContent = label;

        button.addEventListener("click", () => {
          input.value = question;
          resizeInput();
          input.focus();
        });

        suggestions.appendChild(button);
      }

      welcome.append(icon, title, description, suggestions);
      chat.appendChild(welcome);
    }

    function addMessageToScreen(text, role) {
      const row = document.createElement("div");
      row.className =
        "message-row " +
        (role === "user" ? "user-row" : "assistant-row");

      const container = document.createElement("div");
      container.className = "message-container";

      const message = document.createElement("div");
      message.className =
        "message " +
        (role === "user" ? "user-message" : "assistant-message");

      // Use textContent to display text safely.
      message.textContent = text;
      container.appendChild(message);

      if (role === "assistant" && text) {
        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "copy-button";
        copy.textContent = "Copy";

        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(text);
            copy.textContent = "Copied ✓";
            setTimeout(() => {
              copy.textContent = "Copy";
            }, 1200);
          } catch (error) {
            copy.textContent = "Copy failed";
          }
        });

        container.appendChild(copy);
      }

      row.appendChild(container);
      chat.appendChild(row);
      scrollToBottom();

      return row;
    }

    function addMessage(text, role) {
      addMessageToScreen(text, role);

      conversationHistory.push({
        role,
        text
      });

      saveHistory();
    }

    function renderHistory() {
      chat.innerHTML = "";

      if (conversationHistory.length === 0) {
        showWelcome();
        return;
      }

      for (const item of conversationHistory) {
        if (
          item &&
          typeof item.text === "string" &&
          (item.role === "user" || item.role === "assistant")
        ) {
          addMessageToScreen(item.text, item.role);
        }
      }

      scrollToBottom();
    }

    function loadHistory() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved) {
          const parsed = JSON.parse(saved);

          if (Array.isArray(parsed)) {
            conversationHistory = parsed.filter(item =>
              item &&
              typeof item.text === "string" &&
              (item.role === "user" || item.role === "assistant")
            ).slice(-40);
          }
        }
      } catch (error) {
        console.error("Could not load chat history:", error);
        conversationHistory = [];
      }

      renderHistory();
    }

    function showThinking() {
      const row = document.createElement("div");
      row.className = "message-row assistant-row";

      const container = document.createElement("div");
      container.className = "message-container";

      const message = document.createElement("div");
      message.className = "message assistant-message";

      const thinking = document.createElement("span");
      thinking.className = "thinking";

      for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        dot.className = "dot";
        thinking.appendChild(dot);
      }

      message.appendChild(thinking);
      container.appendChild(message);
      row.appendChild(container);
      chat.appendChild(row);
      scrollToBottom();

      return row;
    }

    async function sendMessage() {
      if (isSending) return;

      const message = input.value.trim();
      if (!message) {
        input.focus();
        return;
      }

      isSending = true;
      sendButton.disabled = true;

      // Save the user message, then send only earlier messages as history.
      addMessage(message, "user");
      const historyForRequest = conversationHistory
        .slice(0, -1)
        .slice(-12)
        .map(item => ({
          role: item.role,
          text: item.text
        }));

      input.value = "";
      input.style.height = "auto";

      const thinking = showThinking();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            history: historyForRequest
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "AI response పొందలేకపోయాం."
          );
        }

        if (
          typeof data.reply !== "string" ||
          !data.reply.trim()
        ) {
          throw new Error("AI నుంచి ఖాళీ సమాధానం వచ్చింది.");
        }

        thinking.remove();
        addMessage(data.reply.trim(), "assistant");

      } catch (error) {
        thinking.remove();

        // Do not save a network error as an AI answer in the conversation history.
        addMessageToScreen(
          "క్షమించండి, సమాధానం పొందడంలో సమస్య వచ్చింది: " +
          (error.message || "దయచేసి మళ్లీ ప్రయత్నించండి."),
          "assistant"
        );

      } finally {
        isSending = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    input.addEventListener("input", resizeInput);

    clearButton.addEventListener("click", () => {
      if (isSending) return;
      if (conversationHistory.length === 0) return;

      if (!confirm("ఈ conversation మొత్తాన్ని clear చేయాలా?")) {
        return;
      }

      conversationHistory = [];
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
      input.focus();
    });

    newChatButton.addEventListener("click", () => {
      if (isSending) return;

      conversationHistory = [];
      localStorage.removeItem(STORAGE_KEY);
      input.value = "";
      input.style.height = "auto";
      renderHistory();
      input.focus();
    });

    async function checkApiStatus() {
      try {
        const response = await fetch("/api/health");
        if (!response.ok) throw new Error("API unavailable");

        const data = await response.json();

        if (data.status === "ok") {
          apiStatus.textContent = "● Online";
          apiStatus.style.color = "#16803c";
        } else {
          throw new Error("API not ready");
        }
      } catch (error) {
        apiStatus.textContent = "● Offline";
        apiStatus.style.color = "#c62828";
      }
    }

    loadHistory();
    input.focus();
    checkApiStatus();
    setInterval(checkApiStatus, 30000);
  </script>
</body>
</html>
