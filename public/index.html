<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facts AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      display: flex;
      justify-content: center;
    }

    button,
    textarea {
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 100dvh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */

    .header {
      flex: 0 0 auto;
      height: 70px;
      padding: 10px 15px;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
    }

    .logo {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .header-info {
      flex: 1;
      min-width: 0;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #111111;
    }

    .header p {
      margin: 3px 0 0;
      color: #777777;
      font-size: 12px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .header-button {
      height: 36px;
      padding: 0 11px;
      border: 1px solid #dddddd;
      border-radius: 9px;
      background: #ffffff;
      color: #555555;
      font-size: 13px;
      cursor: pointer;
    }

    .header-button:active {
      background: #eeeeee;
    }

    /* CHAT */

    #chat {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 15px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      width: 100%;
      margin-bottom: 14px;
    }

    .user-row {
      justify-content: flex-end;
    }

    .assistant-row {
      justify-content: flex-start;
    }

    .message-container {
      max-width: 85%;
    }

    .message {
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      font-size: 15px;
    }

    .user-message {
      background: #111111;
      color: #ffffff;
      border-bottom-right-radius: 5px;
    }

    .assistant-message {
      background: #f0f0f0;
      color: #111111;
      border-bottom-left-radius: 5px;
    }

    .copy-button {
      border: none;
      background: transparent;
      color: #777777;
      font-size: 11px;
      padding: 4px 0;
      cursor: pointer;
    }

    /* WELCOME */

    .welcome {
      text-align: center;
      padding: 20px 15px;
      margin-top: 14vh;
    }

    .welcome-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .welcome h2 {
      margin: 0 0 10px;
      font-size: 27px;
      color: #111111;
    }

    .welcome p {
      margin: 0 auto 20px;
      max-width: 520px;
      color: #777777;
      line-height: 1.6;
      font-size: 15px;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .suggestion {
      border: 1px solid #dddddd;
      background: #ffffff;
      color: #444444;
      border-radius: 20px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 13px;
    }

    /* THINKING */

    .thinking {
      display: inline-flex;
      gap: 5px;
      padding: 3px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #777777;
      animation: pulse 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes pulse {
      0%, 60%, 100% {
        opacity: .35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* INPUT */

    .input-area {
      flex: 0 0 auto;
      width: 100%;
      padding: 10px;
      border-top: 1px solid #dddddd;
      background: #ffffff;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      width: 100%;
      min-width: 0;
      min-height: 46px;
      max-height: 130px;
      resize: none;
      border: 1px solid #cccccc;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      outline: none;
      background: #ffffff;
      color: #111111;
      line-height: 1.4;
    }

    #messageInput:focus {
      border-color: #888888;
    }

    #sendButton {
      flex: 0 0 70px;
      width: 70px;
      height: 46px;
      border: none;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      color: #999999;
      font-size: 10px;
      margin-top: 6px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .header {
        height: 64px;
        padding: 8px 10px;
      }

      .logo {
        width: 38px;
        height: 38px;
        min-width: 38px;
        font-size: 16px;
      }

      .header h1 {
        font-size: 18px;
      }

      .header p {
        font-size: 10px;
      }

      .header-button {
        height: 34px;
        padding: 0 8px;
        font-size: 11px;
      }

      #chat {
        padding: 15px 10px;
      }

      .message-container {
        max-width: 91%;
      }

      .message {
        font-size: 15px;
      }

      .welcome {
        margin-top: 8vh;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .welcome p {
        font-size: 14px;
      }

      .suggestion {
        font-size: 12px;
      }

      .input-area {
        padding: 8px;
      }

      #messageInput {
        min-height: 44px;
      }

      #sendButton {
        width: 68px;
        flex-basis: 68px;
        height: 44px;
      }

      .hint {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">

      <div class="logo">F</div>

      <div class="header-info">
        <h1>Facts AI</h1>
        <p>Your personal facts & research assistant</p>
      </div>

      <div class="header-actions">

        <button
          id="newChatButton"
          class="header-button"
          type="button">
          New Chat
        </button>

        <button
          id="clearButton"
          class="header-button"
          type="button">
          Clear
        </button>

      </div>

    </div>


    <div id="chat"></div>


    <div class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Facts AIని ఏదైనా అడగండి..."
          rows="1"
          autocomplete="off"></textarea>

        <button
          id="sendButton"
          type="button">
          Send
        </button>

      </div>

      <div class="hint">
        Enter to send • Shift + Enter for new line
      </div>

    </div>

  </div>


  <script>

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const clearButton =
      document.getElementById("clearButton");

    const newChatButton =
      document.getElementById("newChatButton");


    const STORAGE_KEY =
      "facts_ai_ui_history_v1";

    let conversationHistory = [];

    let isSending = false;


    function saveHistory() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(conversationHistory)
        );

      } catch (error) {

        console.error(error);

      }
    }


    function showWelcome() {

      chat.innerHTML = "";

      const welcome =
        document.createElement("div");

      welcome.className = "welcome";

      welcome.innerHTML = `
        <div class="welcome-icon">F</div>

        <h2>నమస్కారం 👋</h2>

        <p>
          నేను Facts AI. Facts, research,
          explanations మరియు content ideas
          కోసం మీకు సహాయం చేయడానికి సిద్ధంగా ఉన్నాను.
        </p>

        <div class="suggestions">

          <button
            class="suggestion"
            data-question="భారతదేశం గురించి 5 ఆసక్తికరమైన facts చెప్పండి.">
            🇮🇳 India Facts
          </button>

          <button
            class="suggestion"
            data-question="ఒక ఆసక్తికరమైన science fact చెప్పండి.">
            🔬 Science Fact
          </button>

          <button
            class="suggestion"
            data-question="YouTube Shorts కోసం ఒక interesting facts idea ఇవ్వండి.">
            🎬 YouTube Idea
          </button>

          <button
            class="suggestion"
            data-question="ఒక topicని simple Teluguలో explain చేయండి.">
            💡 Explain
          </button>

        </div>
      `;

      chat.appendChild(welcome);

      welcome
        .querySelectorAll(".suggestion")
        .forEach(function(button) {

          button.addEventListener(
            "click",
            function() {

              input.value =
                button.dataset.question;

              resizeInput();

              input.focus();

            }
          );

        });
    }


    function addMessageToScreen(
      text,
      role
    ) {

      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (
          role === "user"
            ? "user-row"
            : "assistant-row"
        );

      const container =
        document.createElement("div");

      container.className =
        "message-container";

      const message =
        document.createElement("div");

      message.className =
        "message " +
        (
          role === "user"
            ? "user-message"
            : "assistant-message"
        );

      message.textContent = text;

      container.appendChild(message);


      if (
        role === "assistant" &&
        text
      ) {

        const copy =
          document.createElement("button");

        copy.type = "button";

        copy.className =
          "copy-button";

        copy.textContent =
          "Copy";

        copy.addEventListener(
          "click",
          async function() {

            try {

              await navigator.clipboard
                .writeText(text);

              copy.textContent =
                "Copied ✓";

              setTimeout(
                function() {
                  copy.textContent =
                    "Copy";
                },
                1200
              );

            } catch (error) {

              copy.textContent =
                "Copy failed";

            }

          }
        );

        container.appendChild(copy);
      }


      row.appendChild(container);

      chat.appendChild(row);

      chat.scrollTop =
        chat.scrollHeight;

      return row;
    }


    function addMessage(
      text,
      role
    ) {

      addMessageToScreen(
        text,
        role
      );

      conversationHistory.push({
        role: role,
        text: text
      });

      saveHistory();
    }


    function renderHistory() {

      chat.innerHTML = "";

      if (
        conversationHistory.length === 0
      ) {

        showWelcome();

        return;
      }

      conversationHistory.forEach(
        function(item) {

          addMessageToScreen(
            item.text,
            item.role
          );

        }
      );

      chat.scrollTop =
        chat.scrollHeight;
    }


    function loadHistory() {

      try {

        const saved =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (saved) {

          const parsed =
            JSON.parse(saved);

          if (Array.isArray(parsed)) {

            conversationHistory =
              parsed;

          }

        }

      } catch (error) {

        conversationHistory = [];

      }

      renderHistory();
    }


    function showThinking() {

      const row =
        document.createElement("div");

      row.className =
        "message-row assistant-row";

      const container =
        document.createElement("div");

      container.className =
        "message-container";

      const message =
        document.createElement("div");

      message.className =
        "message assistant-message";

      message.innerHTML = `
        <span class="thinking">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      `;

      container.appendChild(message);

      row.appendChild(container);

      chat.appendChild(row);

      chat.scrollTop =
        chat.scrollHeight;

      return row;
    }


    function sendMessage() {

      if (isSending) {
        return;
      }

      const message =
        input.value.trim();

      if (!message) {

        input.focus();

        return;
      }

      isSending = true;

      sendButton.disabled =
        true;


      addMessage(
        message,
        "user"
      );


      input.value = "";

      input.style.height =
        "auto";


      const thinking =
        showThinking();


      /*
        UI-only mode.

        The real AI/API response is intentionally
        not connected here.
      */

      setTimeout(
        function() {

          thinking.remove();

          addMessage(
            "మీ message receive అయింది. AI response కోసం API connection అవసరం.",
            "assistant"
          );

          isSending = false;

          sendButton.disabled =
            false;

          input.focus();

        },
        700
      );
    }


    function resizeInput() {

      input.style.height =
        "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          130
        ) + "px";
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    input.addEventListener(
      "input",
      resizeInput
    );


    clearButton.addEventListener(
      "click",
      function() {

        if (
          conversationHistory.length === 0
        ) {
          return;
        }

        if (
          !confirm(
            "ఈ conversation మొత్తాన్ని clear చేయాలా?"
          )
        ) {
          return;
        }

        conversationHistory = [];

        localStorage.removeItem(
          STORAGE_KEY
        );

        renderHistory();

        input.focus();

      }
    );


    newChatButton.addEventListener(
      "click",
      function() {

        conversationHistory = [];

        localStorage.removeItem(
          STORAGE_KEY
        );

        input.value = "";

        input.style.height =
          "auto";

        renderHistory();

        input.focus();

      }
    );


    loadHistory();

    input.focus();

  </script>

</body>
</html>
